<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Trading SaaS</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>
  <header>
    <strong>Trading SaaS 2302041199</strong>
    <div class="right">
      <span id="user-info">...</span>
      <button id="logout-btn" type="button">Logout</button>
    </div>
  </header>

  <div id="tenant-bar"></div>

  <div class="toolbar">
    <select id="symbol">
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="BNBUSDT">BNB/USDT</option>
    </select>
    <select id="interval">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m" selected>15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="1d">1d</option>
    </select>
    <label><input type="checkbox" id="ind-sma"> SMA 20</label>
    <label><input type="checkbox" id="ind-ema"> EMA 20</label>
    <label><input type="checkbox" id="ind-rsi"> RSI 14</label>
    <span id="status">menghubungkan...</span>
  </div>

  <div id="chart"></div>

  <script type="module" src="js/dashboard.js"></script>
</body>

</html>
